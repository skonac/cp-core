{# Operation mode switch (common/mode.py). Context: mode_panel (staff.views.mode_context). #}
{# Colors: normal green, restricted orange, lockdown red (mode-* classes in staff/_base.html). #}
<div class="card mode-{{ mode_panel.current }}" id="operation-mode" style="margin:14px 0; border:2px solid var(--mode)">
  <form method="post" action="{% url 'staff:mode' %}" id="mode-form" style="margin:0">{% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <div class="mode-line"><b>Operation mode:</b>
      <select name="mode" id="mode" class="mode-{{ mode_panel.current }}">
        {% for value, label, desc in mode_panel.modes %}
        <option value="{{ value }}" data-desc="{{ desc }}" {% if value == mode_panel.current %}selected{% endif %}>{{ label|upper }}</option>
        {% endfor %}
      </select></div>
    <p id="mode-desc" class="small" style="margin:8px 0 12px"></p>
    <div class="mode-line"><b>Reason:</b> <input type="text" name="reason" id="reason" maxlength="500"></div>
    <p style="margin:12px 0 0"><button type="submit">Change</button>
      <a class="small" href="{% url 'staff:mode' %}" style="margin-left:10px">history</a></p>
  </form>
</div>
<script>
  (() => {
    const sel = document.getElementById("mode"), desc = document.getElementById("mode-desc"),
          reason = document.getElementById("reason");
    const show = () => {
      desc.textContent = sel.selectedOptions[0].dataset.desc;
      sel.className = "mode-" + sel.value;          // the box takes the color of the mode about to be set
    };
    sel.addEventListener("change", show); show();
    document.getElementById("mode-form").addEventListener("submit", (e) => {
      const mode = sel.value;
      if (mode !== "normal" && !reason.value.trim()) {
        e.preventDefault(); alert("Give a reason for " + mode.toUpperCase() + "."); reason.focus(); return;
      }
      if (!confirm("Switch the site to " + mode.toUpperCase() + "?")) e.preventDefault();
    });
  })();
</script>
